<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#182637"><title>Ballerburg Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#172535;color:#f5eddb;font:15px system-ui,Arial}header{padding:10px 14px;background:#26394d;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0;color:#f3c779}button,select,input{font:inherit}button{background:#d6a85e;border:0;border-radius:9px;padding:11px 14px;font-weight:700;color:#1b2734;touch-action:manipulation}button:disabled{opacity:.35}button.secondary{background:#43576a;color:white}main{max-width:1050px;margin:auto;padding:9px}canvas{display:block;width:100%;height:auto;background:#8cb4cc;border:3px solid #c8a878;border-radius:12px;touch-action:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.panel{background:#26394d;border-radius:10px;padding:10px}.panel.active{outline:2px solid #e5b85d}.panel strong{display:block;color:#ffd78b}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}.control{background:#26394d;padding:12px;border-radius:10px}.control label{display:flex;justify-content:space-between;margin-bottom:6px}input[type=range]{width:100%;accent-color:#e5b85d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{flex:1;min-width:110px}#message{background:#31465a;padding:10px;border-radius:9px;min-height:42px}.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.shop button{font-size:13px;padding:10px 5px}.hint{font-size:12px;color:#c7d2dc}select{padding:8px;background:#fff1d6;border-radius:7px}#overlay{position:fixed;inset:0;background:#0c1823db;display:none;align-items:center;justify-content:center;padding:25px;z-index:5}#overlay .panel{max-width:420px;text-align:center;padding:25px}#overlay h2{color:#ffd78b}@media(min-width:700px){.controls{grid-template-columns:1fr 1fr 1fr}.shop{grid-template-columns:repeat(4,1fr)}}.adjust{display:flex;align-items:center;gap:5px}.adjust input{flex:1;min-width:40px}.adjust button{padding:9px 8px;min-width:42px}button{cursor:pointer}#message{font-weight:600}</style></head><body>
<header><h1>🏰 BALLERBURG</h1><button class="secondary" id="new">Neues Spiel</button></header><main><canvas id="field" width="960" height="480" aria-label="Spielfeld mit zwei Burgen"></canvas>
<div class="stats"><div class="panel" id="p0"></div><div class="panel" id="p1"></div></div>
<div id="message" role="status">Bereit zum Angriff.</div>
<div class="controls"><div class="control"><label>Winkel <b id="angleVal">50°</b></label><div class="adjust"><button type="button" data-adjust="angle:-5">−5°</button><input id="angle" type="range" min="10" max="85" value="50"><button type="button" data-adjust="angle:5">+5°</button></div></div><div class="control"><label>Pulver / Stärke <b id="powerVal">60</b></label><div class="adjust"><button type="button" data-adjust="power:-5">−5</button><input id="power" type="range" min="15" max="100" value="60"><button type="button" data-adjust="power:5">+5</button></div></div><div class="control"><label>Steuersatz <b id="taxVal">15%</b></label><input id="tax" type="range" min="0" max="40" value="15"></div></div>
<div class="actions"><button id="fire">🔥 FEUER!</button><button id="pass" class="secondary">Zug beenden</button><button id="mode" class="secondary">Modus: Computer</button></div>
<div class="panel"><strong>Markt & Bauhof</strong><div class="shop"><button data-buy="balls">+5 Kugeln · 60</button><button data-buy="powder">+50 Pulver · 60</button><button data-buy="repair">Mauer +25 · 100</button><button data-buy="cannon">Kanone +1 · 180</button></div><p class="hint">Pro Zug ein Schuss. Wind beachten. Schüsse verbrauchen eine Kugel und Pulver. Steuern bringen Geld, hohe Steuern kosten Einwohner. Sieg durch Treffer auf den König. Das Spiel speichert sich automatisch.</p></div>
</main><div id="overlay"><div class="panel"><h2 id="endtitle"></h2><p id="endtext"></p><button id="again">Erneut spielen</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('field'),ctx=c.getContext('2d');const W=960,H=480,ground=405;let state,anim=false,trajectory=[],particles=[],mode='ai';const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function player(){return {hp:100,king:100,cannons:2,balls:18,powder:500,gold:300,pop:200,tax:15}}function init(){state={players:[player(),player()],turn:0,round:1,wind:Math.round(rand(-8,8)),craters:[],winner:null};anim=false;trajectory=[];particles=[];$('overlay').style.display='none';$('angle').value=50;$('power').value=60;$('tax').value=15;message('Dein Königreich ist bereit. Wähle Winkel und Pulver.');update();save();draw();if(mode==='ai'&&state.turn===1)ai()}function save(){try{localStorage.setItem('ballerburg_mobile_v1',JSON.stringify({state,mode}))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem('ballerburg_mobile_v1'));if(x&&x.state&&x.state.players?.length===2){state=x.state;mode=x.mode==='pvp'?'pvp':'ai';if(state.winner!==null||!Number.isFinite(state.turn)||state.players.some(p=>!Number.isFinite(p.hp)||!Number.isFinite(p.powder)))return false;return true}}catch(e){}return false}function message(t){$('message').textContent=t}function update(){let p=state.players;for(let i=0;i<2;i++){$('p'+i).className='panel'+(state.turn===i?' active':'');$('p'+i).innerHTML='<strong>'+(i?'🔴 Rote Burg':'🔵 Blaue Burg')+(state.turn===i?' • am Zug':'')+'</strong>👑 '+p[i].king+'% · 🧱 '+p[i].hp+'% · 💣 '+p[i].cannons+'<br>🟡 '+p[i].gold+' · ⚫ '+p[i].balls+' · Pulver '+p[i].powder+'<br>👥 '+p[i].pop+' · Steuer '+p[i].tax+'%'}$('angleVal').textContent=$('angle').value+'°';$('powerVal').textContent=$('power').value;$('taxVal').textContent=$('tax').value+'%';$('mode').textContent='Modus: '+(mode==='ai'?'Computer':'2 Spieler');let lock=anim||state.winner!==null||(mode==='ai'&&state.turn===1);for(let id of ['fire','pass','angle','power','tax'])$(id).disabled=lock;document.querySelectorAll('[data-adjust]').forEach(b=>b.disabled=lock);document.querySelectorAll('[data-buy]').forEach(b=>b.disabled=lock);draw()}
function terrain(x){let mountain=245*Math.exp(-Math.pow((x-480)/172,4));let y=ground-mountain;for(let hole of state.craters){let d=Math.abs(x-hole.x);if(d<hole.r)y+=Math.sqrt(hole.r*hole.r-d*d)*.55}return y}function castleX(i){return i?825:135}function barrel(i){return {x:castleX(i)+(i?-36:36),y:ground-102}}function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#6a9ac2');sky.addColorStop(1,'#c2d7c5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff4d1';ctx.beginPath();ctx.arc(480,53,26,0,7);ctx.fill();ctx.fillStyle='#557b55';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=3)ctx.lineTo(x,terrain(x));ctx.lineTo(W,H);ctx.fill();ctx.strokeStyle='#34543b';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=4)x?ctx.lineTo(x,terrain(x)):ctx.moveTo(x,terrain(x));ctx.stroke();for(let i=0;i<2;i++)castle(i);ctx.fillStyle='#243547';ctx.font='bold 20px system-ui';ctx.fillText('Wind '+(state.wind>0?'→':state.wind<0?'←':'·')+' '+Math.abs(state.wind),395,32);ctx.fillText('Runde '+state.round,15,30);if(trajectory.length){ctx.strokeStyle='#fff9dc';ctx.lineWidth=3;ctx.beginPath();trajectory.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();let p=trajectory[trajectory.length-1];ctx.fillStyle='#20232c';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill()}for(let p of particles){ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}}
function castle(i){let p=state.players[i],x=castleX(i),y=ground;ctx.save();ctx.globalAlpha=.3+.7*p.hp/100;ctx.fillStyle=i?'#9c494a':'#446c91';ctx.fillRect(x-61,y-86,122,86);ctx.fillRect(x-66,y-115,34,115);ctx.fillRect(x+32,y-115,34,115);for(let a=-60;a<60;a+=20)ctx.fillRect(x+a,y-99,13,15);ctx.strokeStyle='#233345';ctx.lineWidth=3;for(let a=-42;a<55;a+=24){ctx.beginPath();ctx.moveTo(x+a,y-84);ctx.lineTo(x+a,y);ctx.stroke()}ctx.fillStyle='#27313a';ctx.fillRect(x-17,y-43,34,43);ctx.fillStyle='#f2cf6b';ctx.fillRect(x-8,y-72,16,24);ctx.fillStyle='#e3a64a';ctx.beginPath();ctx.moveTo(x-12,y-73);ctx.lineTo(x,y-89);ctx.lineTo(x+12,y-73);ctx.fill();ctx.fillStyle='#1c2934';ctx.font='22px serif';ctx.fillText('♛',x-12,y-47);ctx.globalAlpha=1;if(p.cannons>0){let b=barrel(i);ctx.fillStyle='#242e35';ctx.beginPath();ctx.arc(b.x,b.y,14,0,7);ctx.fill();ctx.strokeStyle='#34373d';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+(i?-25:25),b.y-17);ctx.stroke()}ctx.restore();ctx.fillStyle='#f7e8c9';ctx.font='bold 16px system-ui';ctx.fillText(i?'ROT':'BLAU',x-23,ground+24);ctx.fillStyle='#273e3b';ctx.fillRect(x-49,ground+32,98,8);ctx.fillStyle=p.king>35?'#f1c65e':'#d55b4b';ctx.fillRect(x-49,ground+32,98*p.king/100,8)}
function shot(angle,power,who){if(anim||state.winner!==null)return;let p=state.players[who];if(p.cannons<1){message('Keine Kanone! Kaufe eine neue.');return}if(p.balls<1||p.powder<power){message('Zu wenig Kugeln oder Pulver! Nutze den Markt.');return}p.balls--;p.powder-=power;anim=true;update();let b=barrel(who),a=angle*Math.PI/180,dir=who?-1:1,v=(power*.40+9),vx=dir*v*Math.cos(a),vy=-v*Math.sin(a),x=b.x,y=b.y,t=0;trajectory=[];message((who?'Rot':'Blau')+' feuert!');function frame(){for(let z=0;z<3;z++){vx+=state.wind*.00085;vy+=.085;x+=vx*.45;y+=vy*.45;t++;trajectory.push({x,y});if(trajectory.length>70)trajectory.shift();if(x<0||x>W||y>H||t>1200){finish(null);return}if(y>=terrain(x)){finish({x,y});return}for(let j=0;j<2;j++){let cx=castleX(j);if(Math.abs(x-cx)<66&&y>=ground-117&&y<ground){finish({x,y,target:j});return}}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function finish(hit){trajectory=[];if(hit){state.craters.push({x:hit.x,r:rand(13,27)});if(state.craters.length>22)state.craters.shift();let target=hit.target;if(target===undefined){target=[0,1].find(i=>Math.abs(hit.x-castleX(i))<72&&hit.y>ground-125)}if(target!==undefined){let p=state.players[target],cx=castleX(target);let kingHit=Math.abs(hit.x-cx)<21&&hit.y>ground-96&&hit.y<ground-38;let damage=Math.round(rand(12,25));p.hp=clamp(p.hp-damage,0,100);if(kingHit)p.king=0;else if(Math.abs(hit.x-cx)<30)p.king=clamp(p.king-Math.round(rand(5,16)),0,100);if(Math.random()<.25&&p.cannons>0)p.cannons--;if(Math.random()<.17)p.balls=Math.max(0,p.balls-4);message('Treffer auf die '+(target?'rote':'blaue')+' Burg! Mauerschaden '+damage+'.');if(p.king<=0){state.winner=1-target;end()}}else message('Einschlag im Gelände.')}else message('Der Schuss ging ins Leere.');anim=false;draw();if(state.winner===null){nextTurn()}else update()}
function nextTurn(){state.turn=1-state.turn;if(state.turn===0)state.round++;state.wind=Math.round(rand(-8,8));let p=state.players[state.turn];let revenue=Math.round(p.pop*p.tax/100*.8);p.gold+=revenue;if(p.tax>22)p.pop=Math.max(30,p.pop-Math.ceil((p.tax-22)*.8));else p.pop=Math.min(350,p.pop+Math.round((22-p.tax)/5));message((state.turn?'Rot':'Blau')+' ist am Zug. Steuereinnahmen: '+revenue+'.');$('tax').value=p.tax;update();save();if(mode==='ai'&&state.turn===1)setTimeout(ai,650)}
function ai(){if(mode!=='ai'||state.turn!==1||state.winner!==null||anim)return;let p=state.players[1];if(p.cannons<1&&p.gold>=180)buy('cannon',true);if(p.balls<2&&p.gold>=60)buy('balls',true);if(p.powder<60&&p.gold>=60)buy('powder',true);if(p.cannons<1||p.balls<1||p.powder<15){nextTurn();return}let best=null;for(let a=35;a<=82;a+=2)for(let pow=30;pow<=95;pow+=3){if(pow>p.powder)continue;let pos=simulate(a,pow,1);let d=Math.abs(pos.x-castleX(0));if(pos.x<210&&pos.y>ground-140)d*=.7;if(!best||d<best.d)best={a,pow,d}}if(!best){nextTurn();return}shot(clamp(best.a+rand(-5,5),10,85),Math.round(clamp(best.pow+rand(-7,7),15,Math.min(100,p.powder))),1)}
function simulate(a,pow,who){let b=barrel(who),r=a*Math.PI/180,v=pow*.40+9,vx=(who?-1:1)*v*Math.cos(r),vy=-v*Math.sin(r),x=b.x,y=b.y;for(let t=0;t<1200;t++){for(let z=0;z<3;z++){vx+=state.wind*.00085;vy+=.085;x+=vx*.45;y+=vy*.45;if(y>=terrain(x)||x<0||x>W)return {x,y};if(x<210&&y>ground-117)return {x,y}}}return {x,y}}
function buy(type,computer=false){if(anim||state.winner!==null||(!computer&&mode==='ai'&&state.turn===1))return;let p=state.players[state.turn],cost={balls:60,powder:60,repair:100,cannon:180}[type];if(p.gold<cost){if(!computer)message('Nicht genug Gold!');return}if(type==='repair'&&p.hp===100)return;p.gold-=cost;if(type==='balls')p.balls+=5;if(type==='powder')p.powder+=50;if(type==='repair')p.hp=Math.min(100,p.hp+25);if(type==='cannon')p.cannons++;if(!computer)message('Einkauf erfolgreich.');update();save()}
function end(){let win=state.winner;$('endtitle').textContent='🏆 '+(win?'Rot':'Blau')+' gewinnt!';$('endtext').textContent='Der gegnerische König ist besiegt. Gespielt: '+state.round+' Runden.';$('overlay').style.display='flex';save()}
document.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>{const [id,delta]=b.dataset.adjust.split(':');const el=$(id);el.value=clamp(+el.value+(+delta),+el.min,+el.max);update()}));$('angle').addEventListener('input',update);$('power').addEventListener('input',update);$('tax').oninput=()=>{$('taxVal').textContent=$('tax').value+'%';state.players[state.turn].tax=+$('tax').value;update();save()};$('fire').onclick=()=>shot(+$('angle').value,+$('power').value,state.turn);$('pass').onclick=nextTurn;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));$('new').onclick=()=>{if(confirm('Neues Spiel starten?'))init()};$('again').onclick=init;$('mode').onclick=()=>{mode=mode==='ai'?'pvp':'ai';init()};init()window.addEventListener('resize',draw);
})();
</script></body></html>
